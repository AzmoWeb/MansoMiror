name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure the Electron binary is downloaded
        run: node apps/desktop/node_modules/electron/install.js
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Chromium for end-to-end tests
        run: pnpm --filter @mansomirror/web exec playwright install --with-deps chromium
      - name: Website end-to-end tests
        run: pnpm test:e2e
      - name: Desktop end-to-end tests (two app instances under Xvfb)
        timeout-minutes: 10
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox relies on.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a -s "-screen 0 1440x900x24" pnpm --filter @mansomirror/desktop test:e2e
