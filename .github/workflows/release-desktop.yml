name: Release desktop

# Builds MansoMirror Desktop on real Windows, macOS and Linux machines and
# attaches the installers + SHA-256 checksums to a GitHub (pre-)release.
# Two ways to run it:
#  - push a tag "desktop-vX.Y.Z[-beta.N]";
#  - Actions tab → "Release desktop" → "Run workflow": builds on every OS,
#    and publishes a pre-release only if "publish" is ticked.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0-beta.1)"
        required: true
        default: "0.1.0-beta.1"
      publish:
        description: "Publish a GitHub pre-release with the installers"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure the Electron binary is downloaded
        run: node apps/desktop/node_modules/electron/install.js
      - name: Unit tests
        run: pnpm --filter @mansomirror/desktop test
      - name: Set up MSYS2 (Windows AirPlay receiver)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
      - name: Build UxPlay and collect its runtime (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: bash apps/desktop/scripts/build-uxplay-windows.sh "$(cygpath -u "$GITHUB_WORKSPACE")/apps/desktop/vendor/uxplay"
      - name: Check the bundled AirPlay receiver starts on its own (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $root = Join-Path $PWD "apps/desktop/vendor/uxplay"
          $env:GST_PLUGIN_PATH = "$root/lib/gstreamer-1.0"
          $env:GST_PLUGIN_SYSTEM_PATH = $env:GST_PLUGIN_PATH
          $env:GST_PLUGIN_SCANNER = "$root/libexec/gstreamer-1.0/gst-plugin-scanner.exe"
          # Only Windows itself + the bundled DLLs: proves the runtime is self-contained.
          $env:PATH = "$root/bin;C:\Windows\System32;C:\Windows"
          $p = Start-Process -FilePath "$root/bin/uxplay.exe" -ArgumentList "-n","CI-check","-nh","-vs","d3d11videosink" `
            -RedirectStandardOutput out.txt -RedirectStandardError err.txt -PassThru -NoNewWindow
          Start-Sleep -Seconds 10
          $log = (Get-Content out.txt -Raw) + (Get-Content err.txt -Raw)
          Write-Output $log
          if ($p.HasExited) { throw "uxplay.exe exited early (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          if ($log -match "not found") { throw "A required GStreamer plugin is missing" }
      - name: Build installers
        working-directory: apps/desktop
        env:
          # No signing certificate yet: builds are unsigned (see documentation/desktop.md).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm dist ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ inputs.version && format('desktop-v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: MansoMirror Desktop ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }} (bêta, non signée)
          body: |
            Version bêta de MansoMirror Desktop : partage d'écran entre ordinateurs sur le réseau local.

            ⚠️ Les installeurs ne sont **pas encore signés** :
            - Windows affichera « Windows a protégé votre ordinateur » → « Informations complémentaires » → « Exécuter quand même ».
            - macOS : clic droit sur l'application → « Ouvrir ».

            Vérifiez l'empreinte de votre fichier avec `SHA256SUMS.txt`.
          files: out/*
      - name: Update the website's download section
        env:
          GH_TOKEN: ${{ github.token }}
        # Fails harmlessly if GitHub Pages is not enabled yet.
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}" || true
